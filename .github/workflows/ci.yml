name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: astra
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Placeholder values only: CI never calls the LLM provider.
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      DATABASE_URL: sqlite:///ci.db
      RAG_DATABASE_URL: postgresql+psycopg://astra:astra_password@localhost:5433/astra
      OPENAI_API_KEY: ci-placeholder-openai-key
      INTERNAL_API_KEY: ci-placeholder-internal-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q -x "(^|/)\.venv/" .

      - name: Tests with coverage
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=85

      - name: Retrieval evaluation (offline regression gate)
        run: python -m evals.run --output eval-report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker build -t astra-api:ci .
